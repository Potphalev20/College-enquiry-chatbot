<!DOCTYPE html>
<html lang="en">
<head>
<title>College Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(rgba(44, 62, 80, 0.7), rgba(52, 152, 219, 0.7)), url('/static/campus.jpg') no-repeat center center fixed;
    background-size: cover;
    height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.college-header {
    text-align: center;
    margin-bottom: 20px;
    z-index: 1000;
}

.college-name {
    font-size: 2.5rem;
    font-weight: 700;
    color: white;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    margin-bottom: 10px;
}

.college-photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid white;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.admin-link {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.9);
    color: #2c3e50;
    padding: 10px 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: 500;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
    z-index: 1000;
}

.admin-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
}

/* Chat Container */
.chat-container {
    width: 400px;
    height: 600px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.5s ease-out;
    z-index: 999;
}

.header {
    background: linear-gradient(135deg, #2c3e50, #3498db);
    color: white;
    padding: 20px;
    text-align: center;
    font-weight: 600;
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout-btn {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.3s ease;
}

.logout-btn:hover {
    background: rgba(255, 255, 255, 0.3);
}

.minimize-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    background: none;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.3s;
}

.minimize-btn:hover {
    opacity: 1;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.4;
    animation: fadeIn 0.3s ease-in;
}

.message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #2c3e50, #3498db);
    color: white;
}

.message.bot {
    align-self: flex-start;
    background: #f1f3f4;
    color: #333;
}

.typing {
    align-self: flex-start;
    background: #f1f3f4;
    color: #666;
    font-style: italic;
    animation: pulse 1.5s infinite;
}

.input-area {
    padding: 20px;
    background: #f8f9fa;
    border-top: 1px solid #e9ecef;
}

.input-container {
    display: flex;
    gap: 10px;
}

#msg {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e9ecef;
    border-radius: 25px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s ease;
}

#msg:focus {
    border-color: #667eea;
}

button {
    background: linear-gradient(135deg, #2c3e50, #3498db);
    color: white;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

@keyframes slideUp {
    from { transform: translateY(100px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

@media (max-width: 768px) {
    .chat-container {
        width: calc(100vw - 40px);
        height: calc(100vh - 250px);
    }
    .college-name {
        font-size: 2rem;
    }
    .college-photo {
        width: 100px;
        height: 100px;
    }
}
</style>
</head>

<body>

{% if is_admin == 1 %}
<a href="/admin" class="admin-link">Admin Panel</a>
{% endif %}

<!-- CHAT CONTAINER -->
<div class="chat-container">
<div class="header">
<span>College Chatbot</span>
<div>
<button class="logout-btn" onclick="logout()">Logout</button>
<button class="minimize-btn" onclick="toggleChat()">−</button>
</div>
</div>

<div class="messages" id="chatlogs">
<div class="message bot">Hello! I'm your college assistant. How can I help you today?</div>
</div>

<div class="input-area">
<div class="input-container">
<input id="msg" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
<button onclick="send()" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
</div>
</div>
</div>

<script>
let isTyping = false;

function toggleChat() {
    const chat = document.querySelector('.chat-container');
    chat.style.display = chat.style.display === 'none' ? 'flex' : 'none';
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        send();
    }
}

function send() {
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const msg = msgInput.value.trim();

    if (!msg || isTyping) return;

    // Add user message
    addMessage(msg, 'user');

    // Clear input
    msgInput.value = '';
    sendBtn.disabled = true;

    // Show typing indicator
    isTyping = true;
    addTypingIndicator();

    // Simulate bot response
    fetch("/get", {
        method: "POST",
        body: new URLSearchParams("msg=" + msg),
        headers: {"Content-Type": "application/x-www-form-urlencoded"}
    })
    .then(res => res.json())
    .then(data => {
        // Remove typing indicator
        removeTypingIndicator();

        // Add bot response after a short delay
        setTimeout(() => {
            addMessage(data.response, 'bot');
            isTyping = false;
            sendBtn.disabled = false;
        }, 500);
    })
    .catch(error => {
        removeTypingIndicator();
        addMessage("Sorry, there was an error. Please try again.", 'bot');
        isTyping = false;
        sendBtn.disabled = false;
    });
}

function addMessage(text, type) {
    const chatlogs = document.getElementById("chatlogs");
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${type}`;
    messageDiv.textContent = text;
    chatlogs.appendChild(messageDiv);
    chatlogs.scrollTop = chatlogs.scrollHeight;
}

function addTypingIndicator() {
    const chatlogs = document.getElementById("chatlogs");
    const typingDiv = document.createElement("div");
    typingDiv.className = "message typing";
    typingDiv.id = "typing-indicator";
    typingDiv.textContent = "Bot is typing...";
    chatlogs.appendChild(typingDiv);
    chatlogs.scrollTop = chatlogs.scrollHeight;
}

function removeTypingIndicator() {
    const typingIndicator = document.getElementById("typing-indicator");
    if (typingIndicator) {
        typingIndicator.remove();
    }
}

function logout() {
    window.location.href = '/logout';
}
</script>

</body>
</html>
