<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - College Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    overflow: hidden;
    position: relative;
}

body::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    top: -100px;
    left: -100px;
    animation: float 6s ease-in-out infinite;
}

body::after {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    bottom: -50px;
    right: -50px;
    animation: float 8s ease-in-out infinite reverse;
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(20px); }
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    animation: fadeIn 1s ease-in;
}

.card {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    padding: 50px;
    border-radius: 25px;
    width: 100%;
    max-width: 400px;
    color: #333;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 35px 70px rgba(0, 0, 0, 0.2);
}

.logo-section {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
    margin: 0 auto 15px;
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

h1 {
    font-size: 28px;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 14px;
    color: #999;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
    position: relative;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #667eea;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 15px;
    color: #667eea;
    font-size: 16px;
    pointer-events: none;
}

input {
    width: 100%;
    padding: 14px 15px 14px 45px;
    border: 2px solid #e1e5e9;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
    background: #f8f9fc;
}

input:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

input::placeholder {
    color: #bbb;
}

.password-toggle {
    position: absolute;
    right: 15px;
    background: none;
    border: none;
    cursor: pointer;
    color: #999;
    font-size: 16px;
    transition: color 0.3s ease;
    padding: 5px;
}

.password-toggle:hover {
    color: #667eea;
}

.password-strength {
    margin-top: 8px;
    font-size: 12px;
    height: 4px;
    background: #e1e5e9;
    border-radius: 2px;
    overflow: hidden;
}

.strength-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width 0.3s ease;
}

.strength-bar.weak {
    width: 33.33%;
    background: #ff6b6b;
}

.strength-bar.medium {
    width: 66.66%;
    background: #ffa500;
}

.strength-bar.strong {
    width: 100%;
    background: #51cf66;
}

.password-hint {
    font-size: 12px;
    color: #999;
    margin-top: 8px;
    display: none;
}

.password-hint.show {
    display: block;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
    margin-top: 20px;
}

button:before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
}

button:hover:before {
    left: 100%;
}

button:active {
    transform: translateY(0px);
}

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
}

.login-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.login-link a:hover {
    color: #764ba2;
    text-decoration: underline;
}

.error-message {
    background-color: #fee;
    color: #c33;
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 13px;
    border-left: 4px solid #c33;
    display: none;
    animation: slideIn 0.3s ease;
}

.error-message.show {
    display: block;
}

.success-message {
    background-color: #efe;
    color: #3c3;
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 13px;
    border-left: 4px solid #3c3;
    display: none;
    animation: slideIn 0.3s ease;
}

.success-message.show {
    display: block;
}

@keyframes slideIn {
    from { 
        opacity: 0;
        transform: translateX(-10px);
    }
    to { 
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
    .card {
        width: 90%;
        padding: 35px;
    }
    
    h1 {
        font-size: 24px;
    }
    
    .logo-icon {
        width: 50px;
        height: 50px;
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>Create Account</h1>
            <p class="subtitle">Join our college community</p>
        </div>

        <!-- Error & Success Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Signup Form -->
        <form method="POST" id="signupForm">
            <!-- Username Field -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="username"
                        name="username" 
                        placeholder="Choose a username" 
                        required
                        minlength="3"
                        autocomplete="username"
                    >
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password"
                        name="password" 
                        placeholder="Create a strong password" 
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="password-hint" id="passwordHint">
                    Password should be at least 6 characters
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="confirmPassword"
                        name="confirm_password" 
                        placeholder="Confirm your password" 
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle confirm-toggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Sign Up Button -->
            <button type="submit" id="signupBtn">
                <i class="fas fa-user-check"></i>
                Create Account
            </button>
        </form>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="/login">Sign in here</a>
        </div>
    </div>
</div>

<script>
    // Password visibility toggle
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordInput = document.getElementById('password');
    const confirmToggle = document.querySelector('.confirm-toggle');
    const confirmPassword = document.getElementById('confirmPassword');
    
    passwordToggle.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });

    confirmToggle.addEventListener('click', function() {
        const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPassword.setAttribute('type', type);
        this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });

    // Password strength indicator
    const strengthBar = document.getElementById('strengthBar');
    const passwordHint = document.getElementById('passwordHint');

    passwordInput.addEventListener('input', function() {
        const pwd = this.value;
        let strength = 0;

        if (pwd.length >= 6) strength++;
        if (pwd.length >= 10) strength++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) strength++;
        if (/\d/.test(pwd)) strength++;
        if (/[!@#$%^&*]/.test(pwd)) strength++;

        strengthBar.className = 'strength-bar';
        if (strength <= 1) {
            strengthBar.classList.add('weak');
            passwordHint.textContent = '❌ Weak password - Add uppercase, numbers, or special characters';
        } else if (strength <= 3) {
            strengthBar.classList.add('medium');
            passwordHint.textContent = '⚠️ Medium password - Try adding more variety';
        } else {
            strengthBar.classList.add('strong');
            passwordHint.textContent = '✓ Strong password';
        }
        passwordHint.classList.add('show');
    });

    // Form submission
    const signupForm = document.getElementById('signupForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    signupForm.addEventListener('submit', function(e) {
        const pwd = document.getElementById('password').value;
        const confirmPwd = document.getElementById('confirmPassword').value;

        if (pwd !== confirmPwd) {
            e.preventDefault();
            errorMessage.textContent = 'Passwords do not match!';
            errorMessage.classList.add('show');
            return false;
        }

        if (pwd.length < 6) {
            e.preventDefault();
            errorMessage.textContent = 'Password must be at least 6 characters long!';
            errorMessage.classList.add('show');
            return false;
        }

        errorMessage.classList.remove('show');
    });

    // Show error message if redirected with error
    window.addEventListener('load', function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            const error = urlParams.get('error');
            errorMessage.textContent = decodeURIComponent(error);
            errorMessage.classList.add('show');
        }
        if (urlParams.has('success')) {
            const success = urlParams.get('success');
            successMessage.textContent = decodeURIComponent(success);
            successMessage.classList.add('show');
        }
    });
</script>

</body>
</html>
